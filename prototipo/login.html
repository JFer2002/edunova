<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión — EduNova</title>
  <link rel="stylesheet" href="prototipo.css">
</head>
<body>

  <!-- Encabezado Principal -->
  <header class="header-principal">
    <div class="contenedor-header">
      <a href="index.html" class="logo-edunova">
        EduNova <span class="logo-badge">Prototipo</span>
      </a>
      <nav class="nav-principal" aria-label="Navegación principal">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="catalogo.html">Catálogo</a></li>
          <li><a href="login.html" class="activo">Iniciar Sesión</a></li>
          <li><a href="registro.html" class="btn btn-principal btn-sm">Registrarse</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Contenido Principal -->
  <main class="contenedor-principal">

    <section class="tarjeta-formulario">
      <h1 style="text-align: center; margin-bottom: 0.5rem;">Iniciar Sesión</h1>
      <p style="text-align: center; color: var(--color-gris-medio); margin-bottom: 1.5rem; font-size: 0.9rem;">
        Ingresa a tu cuenta para continuar con tu aprendizaje
      </p>

      <form action="panel-estudiante.html" method="GET">
        <div class="grupo-campo">
          <label for="correo">Correo Electrónico</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@edunova.com" required>
        </div>

        <div class="grupo-campo">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="••••••••" required>
        </div>

        <div class="grupo-campo">
          <label for="rol-simulado">Rol de Usuario (Simulación)</label>
          <select id="rol-simulado" name="rol">
            <option value="estudiante" selected>Estudiante</option>
            <option value="instructor">Instructor</option>
            <option value="admin">Administrador</option>
          </select>
        </div>

        <div class="grupo-campo campo-checkbox">
          <input type="checkbox" id="recordarme" name="recordarme">
          <label for="recordarme">Recordar mi sesión en este dispositivo</label>
        </div>

        <button type="submit" class="btn btn-principal btn-bloque">Ingresar al Sistema</button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
        <p>¿No tienes una cuenta aún? <a href="registro.html">Regístrate aquí</a></p>
      </div>
    </section>

  </main>

  <!-- Pie de Página -->
  <footer class="footer-principal">
    <div class="contenedor-footer">
      <p>&copy; 2026 EduNova Inc. Todos los derechos reservados.</p>
    </div>
  </footer>

</body>
</html>
