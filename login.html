<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduNova - Iniciar Sesión</title>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <!-- Íconos de FontAwesome (Para el candado, el correo y las redes sociales) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="./Codigo/css/style.css">
</head>
<body class="auth-body">

    <!-- Contenedor principal que dividirá la pantalla en dos -->
    <main class="auth-container">
        
        <!-- Mitad izquierda: Ilustración y Logo -->
        <section class="auth-image-section">
            <div class="auth-logo">
                <a href="index.html">
                    <img src="./Recursos/Imagenes/Logo EduNova.png" alt="Logotipo de EduNova">
                </a>
            </div>
            <!-- La ilustración principal del escritorio de fondo con CSS o como etiqueta img -->
            <img src="./Recursos/Imagenes/Hombre programando.jpg" alt="Estudiante programando en su escritorio" class="auth-illustration">
        </section>

        <!-- Mitad derecha: Formulario de Login -->
        <section class="auth-form-section">
            <div class="auth-form-container">
                
                <div class="auth-header">
                    <h1>Bienvenido de nuevo</h1>
                    <p>Inicia sesión para seguir aprendiendo</p>
                </div>

                <!-- Formulario -->
                <!-- action="dashboard.html" para que al enviar el formulario nos lleve al dashboard -->
                <form action="dashboard.html" method="GET" class="auth-form">
                    
                    <!-- Campo de Correo Electrónico -->
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-wrapper">
                            <i class="fa-regular fa-envelope input-icon"></i>
                            <input type="email" id="email" name="email" placeholder="Correo electrónico" required>
                        </div>
                    </div>

                    <!-- Campo de Contraseña -->
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock input-icon"></i>
                            <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                            <!-- Ícono del ojo para ver contraseña -->
                            <button type="button" class="btn-eye" aria-label="Mostrar contraseña">
                                <i class="fa-regular fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Opciones de recordar y recuperar contraseña -->
                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Recuérdame</span>
                        </label>
                        <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <!-- Botón de Ingreso -->
                    <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
                </form>

                <!-- Separador -->
                <div class="auth-separator">
                    <span>Otras formas de iniciar sesión</span>
                </div>

                <!-- Botones de Redes Sociales -->
                <div class="social-login">
                    <button type="button" class="btn-social" aria-label="Iniciar con Facebook">
                        <i class="fa-brands fa-facebook" style="color: #1877F2;"></i>
                    </button>
                    <button type="button" class="btn-social" aria-label="Iniciar con Apple">
                        <i class="fa-brands fa-apple" style="color: #000000;"></i>
                    </button>
                    <button type="button" class="btn-social" aria-label="Iniciar con Google">
                        <i class="fa-brands fa-google" style="color: #EA4335;"></i>
                    </button>
                </div>

                <!-- Enlace de Registro -->
                <div class="auth-footer">
                    <p>¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></p>
                </div>

            </div>
        </section>

    </main>

    <script src="./Codigo/js/main.js"></script>
</body>
</html>
